<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Room | Mr. Z's Kahoot</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="brand"><span class="brand-mark">x²</span><span>Mr. Z's Kahoot</span></div>
    <a class="header-link" href="/">Question builder</a>
  </header>

  <main class="wrapper app-grid">
    <section class="panel">
      <h1>Launch a live math game</h1>
      <p class="subtext">Create a room code, let students join, then send a fresh set of 12 questions.</p>

      <div class="controls">
        <button class="primary" id="create-room">Create room</button>
        <button class="secondary" id="generate-set" type="button">Generate set</button>
        <button class="secondary" id="next-question" type="button">Next question</button>
      </div>

      <div class="room-box">
        <div class="muted">Room code</div>
        <div class="code" id="room-code">—</div>
      </div>

      <div class="room-box">
        <div class="muted">Share this with students</div>
        <p class="subtext">Open the student page and enter this room code.</p>
        <div class="join-links" id="student-urls">Finding student links...</div>
        <button class="secondary" id="copy-join-info" type="button" disabled>Copy link and room code</button>
        <div class="status" id="copy-status" aria-live="polite"></div>
      </div>

      <div class="room-box">
        <div class="muted" id="student-count">Students joined</div>
        <ul class="student-list" id="student-list"></ul>
      </div>
    </section>

    <section class="panel">
      <h2>Current question</h2>
      <div id="question-view"></div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const roomCodeDisplay = document.getElementById('room-code');
    const studentList = document.getElementById('student-list');
    const studentCount = document.getElementById('student-count');
    const questionView = document.getElementById('question-view');
    const studentUrls = document.getElementById('student-urls');
    const copyJoinInfo = document.getElementById('copy-join-info');
    const copyStatus = document.getElementById('copy-status');
    const topicSelect = document.createElement('select');
    topicSelect.innerHTML = `
      <option value="both">Both types</option>
      <option value="perfect">Perfect-square trinomials</option>
      <option value="solve">Solve by completing the square</option>
    `;
    topicSelect.style.marginTop = '8px';

    let roomCode = '';
    let questionSet = [];
    let currentIndex = 0;
    let joinUrl = '';
    let studentLinkBases = [];
    let questionTimerInterval = null;

    const coefficients = [-10, -8, -6, -4, -2, 2, 4, 6, 8, 10];

    function pick(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function shuffle(items) {
      for (let i = items.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      return items;
    }

    function signedTerm(value, variable) {
      const sign = value < 0 ? '−' : '+';
      const amount = Math.abs(value);
      const coefficient = amount === 1 && variable ? '' : amount;
      return `${sign} ${coefficient}${variable || ''}`;
    }

    function equation(b, c) {
      const constant = c < 0 ? `− ${Math.abs(c)}` : `+ ${c}`;
      return `x² ${signedTerm(b, 'x')} ${constant} = 0`;
    }

    function formatNumber(value) {
      return value < 0 ? `−${Math.abs(value)}` : `${value}`;
    }

    function rootsAnswer(center, radicand) {
      if (radicand < 0) return 'No real solutions';
      const root = Math.sqrt(radicand);
      if (Number.isInteger(root)) {
        const first = center + root;
        const second = center - root;
        if (first === second) return `x = ${formatNumber(first)}`;
        return `x = ${formatNumber(first)} or x = ${formatNumber(second)}`;
      }
      return `x = ${formatNumber(center)} ± √${radicand}`;
    }

    function perfectQuestion() {
      const b = pick(coefficients);
      const half = b / 2;
      const correct = half * half;
      const choices = new Set([correct]);
      while (choices.size < 4) {
        const distractor = pick([
          correct + 1,
          correct + 4,
          Math.max(0, correct - 1),
          Math.max(0, correct - 4),
          b * b,
        ]);
        choices.add(distractor);
      }
      const answers = shuffle(Array.from(choices));
      const binomial = half < 0 ? `(x − ${Math.abs(half)})²` : `(x + ${half})²`;
      return {
        kind: 'Perfect-square trinomial',
        prompt: `Find c so x² ${signedTerm(b, 'x')} + c is a perfect-square trinomial. Then write it as a binomial squared.`,
        answers: answers.map((value) => `c = ${value}`),
        correct: `c = ${correct}`,
        explanation: `Take half of the x coefficient and square it: (${b}/2)² = ${correct}. The trinomial is ${binomial}.`,
      };
    }

    function solveQuestion() {
      const b = pick(coefficients);
      const half = b / 2;
      const radicand = pick([-9, -4, -1, 2, 3, 5, 7, 9, 16, 25].filter((value) => half * half !== value));
      const c = half * half - radicand;
      const correct = rootsAnswer(-half, radicand);
      const candidates = [
        rootsAnswer(-half + 1, radicand),
        rootsAnswer(-half - 1, radicand),
        rootsAnswer(-half, radicand + 2),
        rootsAnswer(-half, radicand + 4),
        rootsAnswer(-half, Math.abs(radicand)),
        rootsAnswer(half, radicand),
      ];
      const choices = new Set([correct]);
      for (const candidate of shuffle(candidates)) {
        if (candidate !== correct) choices.add(candidate);
        if (choices.size === 4) break;
      }
      if (choices.size < 4) {
        for (const offset of [2, -2, 3, -3]) {
          const candidate = rootsAnswer(-half + offset, Math.abs(radicand) + 1);
          if (candidate !== correct) choices.add(candidate);
          if (choices.size === 4) break;
        }
      }

      const answers = shuffle(Array.from(choices));
      const halfTerm = half < 0 ? `(x − ${Math.abs(half)})` : `(x + ${half})`;
      const completedSquare = `${halfTerm}² = ${radicand}`;
      return {
        kind: 'Solve by completing the square',
        prompt: `Solve by completing the square: ${equation(b, c)}`,
        answers,
        correct,
        explanation: `Move the constant and add (${b}/2)² to both sides: ${completedSquare}. ${correct === 'No real solutions' ? 'A real square cannot equal a negative number.' : `Take the square root of both sides to get ${correct}.`}`,
      };
    }

    function makeQuestion(topic) {
      return topic === 'perfect' ? perfectQuestion() : solveQuestion();
    }

    function stopQuestionCountdown() {
      if (questionTimerInterval) {
        clearInterval(questionTimerInterval);
        questionTimerInterval = null;
      }
    }

    function closeQuestionCountdown() {
      stopQuestionCountdown();
      const timer = questionView.querySelector('#question-timer');
      const message = questionView.querySelector('#question-status');
      if (timer) timer.textContent = "Time's up";
      if (message) message.textContent = 'Time is up. Move to the next question when ready.';
    }

    function startQuestionCountdown(question) {
      stopQuestionCountdown();
      if (question.closed) {
        closeQuestionCountdown();
        return;
      }
      if (!Number.isFinite(question.expiresAt) || !Number.isFinite(question.serverNow)) {
        return;
      }

      const timer = questionView.querySelector('#question-timer');
      const serverOffset = question.serverNow - Date.now();
      const update = () => {
        const remaining = Math.max(0, question.expiresAt - (Date.now() + serverOffset));
        if (timer) timer.textContent = `${Math.ceil(remaining / 1000)} sec`;
        if (remaining === 0) closeQuestionCountdown();
      };

      update();
      if (!questionTimerInterval && question.expiresAt > Date.now() + serverOffset) {
        questionTimerInterval = setInterval(update, 250);
      }
    }

    function renderQuestionCard(question) {
      if (!question) {
        stopQuestionCountdown();
        questionView.innerHTML = '<p class="muted">No question yet. Generate a set to send it to students.</p>';
        return;
      }

      const card = document.createElement('article');
      card.className = 'question-card';
      card.innerHTML = `
        <div class="question-top">
          <span class="question-kind">Question ${currentIndex + 1} of ${questionSet.length}</span>
          <span class="muted">${question.kind}</span>
          <span class="timer" id="question-timer" aria-live="polite">30 sec</span>
        </div>
        <div class="question-body">
          <div class="prompt">${question.prompt}</div>
          <div class="answer-grid">
            ${question.answers.map((answer) => `
              <button class="answer-option" type="button" data-answer="${answer}">
                <span class="answer-dot"></span>
                <span>${answer}</span>
              </button>
            `).join('')}
          </div>
          <div class="status" id="question-status">Answers close in 30 seconds.</div>
          <div class="status">Correct answer: <strong>${question.correct}</strong></div>
        </div>
      `;
      questionView.innerHTML = '';
      questionView.appendChild(card);
      startQuestionCountdown(question);
    }

    function updateStudentList(students = []) {
      studentList.innerHTML = '';
      studentCount.textContent = `Students joined (${students.length})`;
      if (!students.length) {
        studentList.innerHTML = '<li><span class="muted">No students joined yet.</span></li>';
        return;
      }

      students.sort((left, right) => right.score - left.score).forEach((student) => {
        const item = document.createElement('li');
        const name = document.createElement('strong');
        name.textContent = student.name;
        const details = document.createElement('span');
        details.textContent = `${student.score} pts · ${student.answered ? 'Answered' : 'Thinking'}`;
        item.append(name, details);
        studentList.appendChild(item);
      });
    }

    function renderStudentLinks() {
      studentUrls.replaceChildren();
      studentLinkBases.forEach((baseUrl) => {
        const url = roomCode ? `${baseUrl}?code=${encodeURIComponent(roomCode)}` : baseUrl;
        const link = document.createElement('a');
        link.href = url;
        link.textContent = url;
        studentUrls.appendChild(link);
      });
    }

    fetch('/connection-info')
      .then((response) => {
        if (!response.ok) throw new Error('Could not load student links.');
        return response.json();
      })
      .then((info) => {
        studentLinkBases = [...new Set([info.studentUrl, ...info.networkUrls])];
        joinUrl = info.networkUrls[0] || info.studentUrl;
        renderStudentLinks();
        copyJoinInfo.disabled = !roomCode;
      })
      .catch((error) => {
        studentUrls.textContent = error.message;
      });

    copyJoinInfo.addEventListener('click', async () => {
      if (!roomCode || !joinUrl) return;
      try {
        await navigator.clipboard.writeText(`Join Mr. Z's Kahoot: ${joinUrl}?code=${encodeURIComponent(roomCode)}`);
        copyStatus.textContent = 'Join link and room code copied.';
      } catch (error) {
        copyStatus.textContent = `Copy failed. Share ${joinUrl}?code=${roomCode} with students.`;
      }
    });

    function generateSet() {
      if (!roomCode) {
        alert('Create a room first.');
        return;
      }

      const topic = topicSelect.value;
      const questions = [];
      for (let i = 0; i < 12; i += 1) {
        const selectedTopic = topic === 'both' ? (i % 2 === 0 ? 'perfect' : 'solve') : topic;
        questions.push(makeQuestion(selectedTopic));
      }
      questionSet = shuffle(questions);
      currentIndex = 0;
      document.getElementById('next-question').disabled = false;
      renderQuestionCard(questionSet[0]);
      document.getElementById('next-question').textContent = 'Next question';
      socket.emit('share-questions', { code: roomCode, questions: questionSet });
    }

    document.getElementById('create-room').addEventListener('click', () => {
      socket.emit('create-room');
    });

    document.getElementById('generate-set').addEventListener('click', () => {
      generateSet();
    });

    document.getElementById('next-question').addEventListener('click', () => {
      if (!roomCode || !questionSet.length) {
        alert('Generate a question set first.');
        return;
      }

      const nextIndex = currentIndex + 1;
      if (nextIndex >= questionSet.length) {
        socket.emit('next-question', { code: roomCode });
        return;
      }

      currentIndex = nextIndex;
      renderQuestionCard(questionSet[currentIndex]);
      if (currentIndex === questionSet.length - 1) {
        document.getElementById('next-question').textContent = 'Finish game';
      }
      socket.emit('next-question', { code: roomCode });
    });

    socket.on('room-created', ({ code }) => {
      stopQuestionCountdown();
      roomCode = code;
      roomCodeDisplay.textContent = code;
      renderStudentLinks();
      copyJoinInfo.disabled = !joinUrl;
      copyStatus.textContent = '';
      document.getElementById('next-question').disabled = false;
      currentIndex = 0;
      questionSet = [];
      questionView.innerHTML = '<p class="muted">Waiting for a question set.</p>';
    });

    socket.on('room-state', ({ students = [] }) => {
      updateStudentList(students);
    });

    socket.on('question-update', (question) => {
      if (question) {
        renderQuestionCard(question);
      }
    });

    socket.on('question-closed', () => {
      closeQuestionCountdown();
    });

    socket.on('teacher-disconnected', () => {
      stopQuestionCountdown();
      roomCode = '';
      roomCodeDisplay.textContent = '—';
      updateStudentList([]);
      questionView.innerHTML = '<p class="muted">Teacher disconnected.</p>';
    });

    socket.on('game-finished', ({ students = [] }) => {
      stopQuestionCountdown();
      updateStudentList(students);
      questionView.innerHTML = '<p class="muted">Game finished. The scoreboard shows the final scores.</p>';
      document.getElementById('next-question').disabled = true;
    });

    socket.on('connect_error', () => {
      questionView.innerHTML = '<p class="muted">Could not connect to the live game server. Refresh this page to try again.</p>';
    });

    const modeLabel = document.createElement('div');
    modeLabel.style.position = 'fixed';
    modeLabel.style.right = '24px';
    modeLabel.style.bottom = '20px';
    modeLabel.style.background = 'rgba(22,61,115,.9)';
    modeLabel.style.border = '1px solid rgba(181, 212, 244, .2)';
    modeLabel.style.borderRadius = '12px';
    modeLabel.style.padding = '12px 14px';
    modeLabel.style.color = '#f8fbff';
    modeLabel.style.fontSize = '14px';
    modeLabel.innerHTML = 'Question type: ';
    modeLabel.appendChild(topicSelect);
    document.body.appendChild(modeLabel);
  </script>
</body>
</html>
